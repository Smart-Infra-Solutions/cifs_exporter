when:
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/smart-infra-solutions/cifs_exporter
      username: Ch1ch1
      password:
        from_secret: ghcr_token
      platforms: linux/amd64
      dockerfile: Dockerfile
      context: .
      auto_tag: true
